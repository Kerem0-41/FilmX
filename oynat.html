<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>FilmX Oynatıcı</title>
<!-- FilmX'in kendi oynatıcısı (Netflix tarzı, kırmızı). Adres #'ten sonra gelir:
     #<base64url m3u8/mp4>  doğrudan video   |  #vm:<vidmoly kimliği>  |  #dk:<base64url sunucu adresi>
     Video bizim sunucudan geçmez. Türkçe altyazı: kaynakta varsa o; yoksa izlerken ses parçaları robot sunucusuna gider,
     Gemini yazıya döküp Türkçeye çevirir, kaydedilir; sonraki açılışta hazır gelir. -->
<style>
:root{--k:#e50914;--k2:#ff2a36;--y:#fff;--g:rgba(255,255,255,.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--y);user-select:none}
#kutu{position:fixed;inset:0;background:#000}
video{width:100%;height:100%;display:block;background:#000}
#durum{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:16px;pointer-events:none;color:#ddd}
.don{width:54px;height:54px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--k);border-radius:50%;animation:d 0.9s linear infinite}
@keyframes d{to{transform:rotate(360deg)}}
#alt{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:center;pointer-events:none;padding:0 6%;transition:bottom .25s}
#kutu.acik #alt{bottom:calc(92px + env(safe-area-inset-bottom))}
#alt span{max-width:min(92%,1100px);padding:0;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-weight:700;color:#fff;font-size:clamp(18px,3.4vw,40px);line-height:1.22;letter-spacing:.2px;text-align:center;white-space:pre-line;text-wrap:balance;
  -webkit-text-stroke:.09em #000;paint-order:stroke fill;text-shadow:0 0 3px #000,0 2px 4px rgba(0,0,0,.9)}   /* kutusuz, kalın beyaz + siyah kontur (TV altyazısı) */
#alt span:empty{display:none}
#ust,#alts{position:absolute;left:0;right:0;opacity:0;transition:opacity .25s;pointer-events:none}
#kutu.acik #ust,#kutu.acik #alts{opacity:1;pointer-events:auto}
#ust{top:0;padding:calc(14px + env(safe-area-inset-top)) 20px 40px;background:linear-gradient(#000c,#0000);font-size:17px;font-weight:600}
#alts{bottom:0;padding:40px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000d)}
#cizgi{position:relative;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none}
#cizgi .r{position:absolute;left:0;right:0;height:4px;background:rgba(255,255,255,.25);border-radius:2px;transition:height .15s}
#cizgi:hover .r,#cizgi.surukle .r{height:7px}
#cizgi .tm,#cizgi .iz{position:absolute;left:0;height:100%;border-radius:2px}
#cizgi .tm{background:rgba(255,255,255,.4);width:0}
#cizgi .iz{background:var(--k);width:0}
#cizgi .nk{position:absolute;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:var(--k);left:0;transform:scale(0);transition:transform .15s}
#cizgi:hover .nk,#cizgi.surukle .nk{transform:scale(1)}
#ipucu{position:absolute;bottom:22px;padding:3px 8px;background:#000d;border-radius:4px;font-size:13px;transform:translateX(-50%);display:none}
#cizgi:hover #ipucu,#cizgi.surukle #ipucu{display:block}
#dugmeler{display:flex;align-items:center;gap:6px;margin-top:6px}
button{background:none;border:0;color:var(--y);padding:8px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
button:hover{background:rgba(255,255,255,.1)}
button svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.dolu svg{fill:currentColor;stroke:none}
#bOyna.gecis svg{animation:oyGecis .32s cubic-bezier(.3,1.5,.5,1)}
@keyframes oyGecis{0%{transform:scale(.4) rotate(-90deg);opacity:.2}100%{transform:none;opacity:1}}
#orta.goster svg{animation:oyGecis .32s cubic-bezier(.3,1.5,.5,1)}
#sure{font-variant-numeric:tabular-nums;color:var(--g);margin-left:6px;font-size:14px;white-space:nowrap}
.bos{flex:1}
#ses{width:90px;accent-color:var(--k)}
@media (pointer:coarse){#ses{display:none}}
#menu{position:absolute;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:#141414f5;border:1px solid #2a2a2a;border-radius:12px;width:250px;max-height:62vh;overflow-y:auto;overflow-x:hidden;display:none;padding:6px 0;box-shadow:0 12px 40px #000a;scrollbar-width:thin;scrollbar-color:#555 transparent}
#menu::-webkit-scrollbar{width:6px}#menu::-webkit-scrollbar-track{background:transparent}#menu::-webkit-scrollbar-thumb{background:#555;border-radius:3px}
#menu.ac{display:block}
#menu h4{margin:8px 16px 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#999}
#menu .s{padding:9px 16px 9px 36px;cursor:pointer;position:relative;font-size:14px}
#menu .s:hover{background:#ffffff14}
#menu .s.sec::before{content:"";position:absolute;left:14px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--k)}
#menu .hizlar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 12px 10px}
#menu .s.h{padding:8px 0;text-align:center;border:1px solid #333;border-radius:8px}
#menu .s.h.sec{background:var(--k);border-color:var(--k)}
#menu .s.h.sec::before{display:none}
#menu{position:absolute}#menu .kapat{position:absolute;top:6px;right:6px;padding:4px;border-radius:50%;z-index:1}#menu .kapat svg{width:18px;height:18px;stroke-width:2.4}
#sonraki{position:absolute;right:20px;bottom:calc(96px + env(safe-area-inset-bottom));display:none;gap:10px;align-items:center;background:#fff;color:#000;font-weight:700;font-size:16px;padding:12px 20px;border-radius:8px;box-shadow:0 8px 30px #000a;z-index:3}
#sonraki:hover{background:#ddd}#sonraki svg{width:22px;height:22px;fill:#000;stroke:#000}
#sonraki.goster{display:flex}
@media (max-width:640px){#sonraki{right:10px;bottom:calc(56px + env(safe-area-inset-bottom));font-size:13px;padding:8px 12px}#sonraki svg{width:16px;height:16px}}
#menu .not{padding:0 16px 8px 36px;color:#888;font-size:12px;line-height:1.4}
#orta{position:absolute;top:50%;left:50%;width:84px;height:84px;margin:-42px;border-radius:50%;background:#0008;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#orta.goster{opacity:1;transform:scale(1.1)}
#orta svg{width:44px;height:44px;fill:#fff}
.atla{position:absolute;top:0;bottom:0;width:33%;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .3s;font-weight:700;font-size:18px}
.atla.goster{opacity:1}
#atlaG{left:0;background:radial-gradient(circle at left,#ffffff22,#0000 70%)}
#atlaI{right:0;background:radial-gradient(circle at right,#ffffff22,#0000 70%)}
#rozet{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;font-size:12px;padding:4px 9px;border-radius:20px;background:#e5091433;border:1px solid var(--k);color:#fff;display:none}
#marka{color:var(--k);font-weight:900;letter-spacing:.04em;margin-right:10px}
#kutu:not(:fullscreen) #baslik{display:none}

/* telefon / küçük oynatıcı */
@media (max-width:640px), (max-height:420px){
  #ust{padding:calc(8px + env(safe-area-inset-top)) 12px 24px;font-size:13px}
  #alts{padding:24px 8px calc(4px + env(safe-area-inset-bottom))}
  #dugmeler{gap:0;margin-top:2px}
  button{padding:6px}
  button svg{width:22px;height:22px}
  #sure{font-size:12px;margin-left:2px}
  #alt{bottom:5%;padding:0 4%}
  #kutu.acik #alt{bottom:calc(56px + env(safe-area-inset-bottom))}
  #alt span{font-size:clamp(13px,3.6vw,20px);padding:2px 8px}
  #menu{right:8px;bottom:calc(54px + env(safe-area-inset-bottom));width:min(210px,calc(100% - 16px));max-height:calc(100% - 70px);border-radius:10px;padding:4px 0}
  #menu h4{margin:6px 12px 2px;font-size:10px}
  #menu .s{padding:7px 12px 7px 30px;font-size:13px}
  #menu .s.sec::before{left:11px;width:8px;height:8px;margin-top:-4px}
  #menu .not{display:none}
  #menu .hizlar{gap:4px;padding:2px 8px 8px}
  #menu .s.h{padding:6px 0;font-size:12px}
  #rozet{top:calc(8px + env(safe-area-inset-top));right:8px;font-size:10px;padding:3px 7px}
  #orta{width:60px;height:60px;margin:-30px}
}
@media (max-width:400px){ #bGeri,#bIleri{display:none} }
/* KEŞFET kesit modu (oynat.html?kesit=1): kontrol yok, video ekranı doldurur, sessiz başlar */
body.kesit #ust,body.kesit #alts,body.kesit #alt,body.kesit #menu,body.kesit #orta,body.kesit #sonraki,body.kesit #rozet,body.kesit .atla{display:none!important}
body.kesit video{object-fit:cover}
body.kesit #durum{background:transparent}body.kesit #dyazi{display:none}
</style>
</head>
<body>
<div id="kutu">
  <video id="v" playsinline preload="metadata" poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
  <div id="alt"><span></span></div>
  <div id="durum"><div class="don"></div><div id="dyazi">Yükleniyor…</div></div>
  <div id="orta"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
  <div class="atla" id="atlaG">-10 sn</div><div class="atla" id="atlaI">+10 sn</div>
  <div id="ust"><span id="marka">FILMX</span><span id="baslik"></span></div>
  <div id="rozet"></div>
  <div id="alts">
    <div id="cizgi"><div class="r"><div class="tm"></div><div class="iz"></div></div><div class="nk"></div><div id="ipucu">0:00</div></div>
    <div id="dugmeler">
      <button id="bOyna" class="dolu" title="Oynat (Boşluk)"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="bGeri" title="10 sn geri (←)"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><text x="12" y="15.5" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">10</text></svg></button>
      <button id="bIleri" title="10 sn ileri (→)"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15.5" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">10</text></svg></button>
      <button id="bSes" title="Ses (M)"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path id="dalga" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
      <input id="ses" type="range" min="0" max="1" step="0.02" value="1">
      <span id="sure">0:00 / 0:00</span>
      <span class="bos"></span>
      <button id="bAlt" title="Altyazı ve ses (C)"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 13h4M12 13h6M6 16h8M16 16h2"/></svg></button>
      <button id="bAyar" title="Ayarlar: kalite ve hız"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button id="bPip" title="Resim içinde resim"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="8" height="6" rx="1" fill="currentColor"/></svg></button>
      <button id="bTam" title="Tam ekran (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <div id="menu"></div>
  <button id="sonraki"><span>Sonraki bölüm</span><svg viewBox="0 0 24 24"><path d="M6 5v14l9-7z"/><path d="M18 5v14"/></svg></button>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
(function () {
  var ROBOT = 'https://filmx-robot.chatbox-tk.workers.dev/altyazi';
  var $ = function (i) { return document.getElementById(i); };
  var v = $('v'), kutu = $('kutu'), durum = $('durum'), altSpan = document.querySelector('#alt span');
  var hls = null, anahtar = '';
  // KEŞFET kesiti: rastgele sahneden 30 sn, döngü; altyazı/kaldığı yer/geçmiş yok. Ana sayfa postMessage ile sesi açar/durdurur.
  var KESIT = /[?&]kesit=1/.test(location.search), BEKLE = /[?&]bekle=1/.test(location.search), kesitBas = -1;
  if (KESIT) { document.body.classList.add('kesit'); v.muted = true; v.setAttribute('muted', ''); v.playsInline = true;
    addEventListener('message', function (e) { var d = e.data || {}; if (!d.kesit) return;
      if (d.kesit === 'ses') { v.muted = !d.acik; if (d.acik) { v.volume = 1; setTimeout(function () { if (v.paused && !v.ended) { v.muted = true; v.play().catch(function () {}); try { parent.postMessage({ kesit: 'sesEngel' }, '*'); } catch (e) {} } }, 300); } }
      else if (d.kesit === 'dur') v.pause(); else if (d.kesit === 'oyna') { BEKLE = false; var p = v.play(); if (p && p.catch) p.catch(function () { v.muted = true; v.play().catch(function () {}); }); } });
    v.addEventListener('canplay', function () { if (BEKLE) try { parent.postMessage({ kesit: 'hazir' }, '*'); } catch (e) {} });
    function kesitYer() { var d = v.duration; if (!isFinite(d) || d < 120) return; if (kesitBas < 0) { kesitBas = Math.floor(d * (0.12 + Math.random() * 0.6)); v.currentTime = kesitBas; } }
    v.addEventListener('loadedmetadata', kesitYer); v.addEventListener('durationchange', kesitYer);
    v.addEventListener('timeupdate', function () { if (kesitBas >= 0 && (v.currentTime > kesitBas + 30 || v.currentTime < kesitBas - 2)) v.currentTime = kesitBas; });
    v.addEventListener('playing', function () { try { parent.postMessage({ kesit: 'oynuyor' }, '*'); } catch (e) {} }); }
  function kesitHata() { try { parent.postMessage({ kesit: 'hata' }, '*'); } catch (e) {} }
  function goster(t, don) { if (don === false && t && typeof KESIT !== 'undefined' && KESIT) kesitHata(); $('dyazi').textContent = t; durum.style.display = t ? 'flex' : 'none'; durum.querySelector('.don').style.display = don === false ? 'none' : ''; }
  function b64(s) { return decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/')))); }
  function saat(s) { s = Math.max(0, Math.floor(s || 0)); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0'); }
  function sakla(k, d) { try { localStorage.setItem('fxo_' + k, JSON.stringify(d)); } catch (e) {} }
  function oku(k, d) { try { var x = localStorage.getItem('fxo_' + k); return x == null ? d : JSON.parse(x); } catch (e) { return d; } }
  try { var bq = new URLSearchParams(location.search).get('b') || (function () { var e = window.frameElement && window.frameElement.closest('.player-wrap'); e = e && e.querySelector('.player-title'); if (e) { e = e.cloneNode(true); e.querySelectorAll('button').forEach(function (b) { b.remove(); }); } return e ? e.textContent.replace(/^\s*▶\s*/, '') : ''; })(); $('baslik').textContent = bq; } catch (e) {}

  // ---------- kaynak çözme (eski oynat.html ile aynı adres biçimleri) ----------
  function vmGom(id) { goster(''); kutu.remove(); var f = document.createElement('iframe'); f.src = 'https://vidmoly.org/embed-' + id + '.html';
    f.allow = 'autoplay; fullscreen'; f.allowFullscreen = true; f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0'; document.body.appendChild(f); }
  function vmM3u8(id) { return fetch('https://vidmoly.org/embed-' + id + '.html', { credentials: 'omit' }).then(function (r) { return r.ok ? r.text() : ''; })
    .then(function (h) { var m = h.match(/https?:\/\/[^"'\s]+\.m3u8[^"'\s]*/); return m ? m[0] : ''; }).catch(function () { return ''; }); }
  function vmDene(ids, i) { if (i >= ids.length) return Promise.resolve(''); return vmM3u8(ids[i]).then(function (u) { return u || vmDene(ids, i + 1); }); }
  var KAPI = 'https://filmx-giris.chatbox-tk.workers.dev';
  // FilmX sayfası (üst pencere): oturum + cihaz imzası onda. Oynatıcı yalnız onun içinde çalışır.
  var UST = null; try { UST = window.parent !== window && parent.eval('typeof KAPI !== "undefined" ? KAPI : null'); } catch (e) { UST = null; }
  if (UST && UST.URL) KAPI = UST.URL;
  // giriş sunucusuna imzalı GET (video bulan uçlar giriş ister)
  function kapiGet(u) { if (!UST) return fetch(u);
    var yol = u.indexOf(KAPI) === 0 ? u.slice(KAPI.length) : new URL(u).pathname;
    return UST.cihazHazirla().then(function () { return UST.imzaBaslik('GET', yol); }).then(function (hd) { return fetch(u, { headers: hd }); }); }
  // başka sitenin oynatıcısı (son çare): kendi oynatıcımız çözemezse
  function iframeGom(u) { if (KESIT) { kesitHata(); return; } goster(''); kutu.remove(); var f = document.createElement('iframe'); f.src = u; f.allow = 'autoplay; fullscreen; encrypted-media'; f.allowFullscreen = true;
    f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0'; document.body.appendChild(f); }
  // dizi82 oynatıcısı (…/player/<kimlik>): m3u8 aynı kimlikle açık sunucuda
  var D82_SUNUCU = ['https://one.makesomthingup.click/'];
  function d82Oyn(pu) { var id = (pu.match(/\/player\/([A-Za-z0-9_-]+)/) || [])[1]; if (!id) { iframeGom(pu); return Promise.resolve(''); }
    function dene(i) { if (i >= D82_SUNUCU.length) { iframeGom(pu); return ''; } var u = D82_SUNUCU[i] + id + '/master.m3u8';
      return fetch(u, { credentials: 'omit' }).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; })
        .then(function (t) { return /#EXTM3U/.test(t) ? u : dene(i + 1); }); }
    return dene(0); }
  var h = location.hash.slice(1), soz;
  // oynat.html#i:<kimlik>: asıl adres FilmX sayfasının belleğinde (FXO). Dışarıdan açılan / paylaşılan bağlantı çalışmaz.
  if (h.indexOf('i:') === 0) { var fx = null; try { fx = parent.FXO && parent.FXO[h.slice(2)]; } catch (e) {} h = fx || ''; }
  else h = '';
  if (!h) { goster('Bu video yalnızca FilmX içinden açılabilir.', false); return; }
  if (h.indexOf('vm:') === 0) { var id = h.slice(3); anahtar = 'vm:' + id; soz = vmDene([id], 0).then(function (u) { if (!u) vmGom(id); return u; }); }
  else if (h.indexOf('dk:') === 0) { anahtar = h;
    soz = kapiGet(b64(h.slice(3))).then(function (r) { return r.json(); }).then(function (j) { var ids = (j && j.vm) || [];
      if (!ids.length) { goster('Bu bölüm şu an açılamıyor.', false); return ''; }
      return vmDene(ids, 0).then(function (u) { if (!u) vmGom(ids[0]); return u; }); }).catch(function () { goster('Bu bölüm şu an açılamıyor.', false); return ''; });
  } else if (h.indexOf('d8:') === 0) { var pu = b64(h.slice(3)); anahtar = 'd8:' + (pu.match(/\/player\/([A-Za-z0-9_-]+)/) || [, pu])[1]; soz = d82Oyn(pu);
  } else if (h.indexOf('d82:') === 0) { var yol = b64(h.slice(4)); anahtar = 'd82:' + yol;
    soz = kapiGet(KAPI + '/d82?j=1&y=' + encodeURIComponent(yol)).then(function (r) { return r.json(); })
