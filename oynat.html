<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>FilmX Oynatıcı</title>
<!-- Doğrudan HLS (m3u8) oynatıcı: adres #'ten sonra base64url olarak gelir (oynat.html#<adres>). Video bizim sunucudan geçmez. -->
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  video{width:100%;height:100%;background:#000;display:block}
  #durum{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ddd;font:15px system-ui,sans-serif;text-align:center;padding:16px;pointer-events:none}
</style>
</head>
<body>
<video id="v" controls playsinline preload="metadata"></video>
<div id="durum">Yükleniyor…</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
// #<base64url m3u8>          : doğrudan video (fullhd)
// #vm:<vidmoly kimliği>       : m3u8 vidmoly sayfasından taze alınır (adres süreli; vidmoly bizim siteye CORS izni veriyor)
// #dk:<base64url sunucu adresi>: önce giriş sunucusundan bölümün vidmoly kimlikleri { vm: [..] }, sonra yukarıdaki gibi
(function () {
  var v = document.getElementById('v'), durum = document.getElementById('durum');
  function goster(t) { durum.textContent = t; durum.style.display = t ? 'flex' : 'none'; }
  function b64(s) { return decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/')))); }
  // m3u8 bulunamazsa son çare: vidmoly'nin kendi oynatıcısı
  function vmGom(id) { goster(''); v.remove(); var f = document.createElement('iframe'); f.src = 'https://vidmoly.org/embed-' + id + '.html';
    f.allow = 'autoplay; fullscreen'; f.allowFullscreen = true; f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0'; document.body.appendChild(f); }
  function vmM3u8(id) { return fetch('https://vidmoly.org/embed-' + id + '.html', { credentials: 'omit' }).then(function (r) { return r.ok ? r.text() : ''; })
    .then(function (h) { var m = h.match(/https?:\/\/[^"'\s]+\.m3u8[^"'\s]*/); return m ? m[0] : ''; }).catch(function () { return ''; }); }
  function vmDene(ids, i) { if (i >= ids.length) return Promise.resolve(''); return vmM3u8(ids[i]).then(function (u) { return u || vmDene(ids, i + 1); }); }
  var h = location.hash.slice(1), soz;
  if (h.indexOf('vm:') === 0) { var id = h.slice(3); soz = vmDene([id], 0).then(function (u) { if (!u) vmGom(id); return u; }); }
  else if (h.indexOf('dk:') === 0) {
    soz = fetch(b64(h.slice(3))).then(function (r) { return r.json(); }).then(function (j) { var ids = (j && j.vm) || [];
      if (!ids.length) { goster('Bu bölüm şu an açılamıyor.'); return ''; }
      return vmDene(ids, 0).then(function (u) { if (!u) vmGom(ids[0]); return u; }); }).catch(function () { goster('Bu bölüm şu an açılamıyor.'); return ''; });
  } else { var a = ''; try { a = b64(h); } catch (e) {} soz = Promise.resolve(a); }
  goster('Yükleniyor…');
  soz.then(function (adres) { if (adres) oynat(adres); });
  function oynat(adres) {
  if (!/^https:\/\//.test(adres)) { goster('Video adresi geçersiz.'); return; }
  v.addEventListener('playing', function () { goster(''); });
  v.addEventListener('loadedmetadata', function () { goster(''); });
  if (window.Hls && Hls.isSupported()) {
    var hls = new Hls({ maxBufferLength: 60, startLevel: -1 });
    hls.on(Hls.Events.ERROR, function (_, d) {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR) { goster('Bağlantı sorunu, tekrar deneniyor…'); setTimeout(function () { hls.startLoad(); }, 2000); }
      else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      else goster('Bu video şu an oynatılamıyor.');
    });
    hls.loadSource(adres); hls.attachMedia(v);
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = adres; }   // iOS Safari: yerleşik HLS
  else goster('Tarayıcı bu videoyu oynatamıyor.');
  }
})();
</script>
</body>
</html>
